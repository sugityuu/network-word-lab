<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163b63"><title>ネットワーク単語ラボ</title>
<style>
:root{--navy:#163b63;--blue:#2878b8;--ink:#192a3d;--muted:#64758a;--paper:#f3f6fa;--line:#dce5ee;--green:#137a4b;--red:#b73535}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}
header{background:linear-gradient(120deg,#163b63,#2878b8);color:#fff;padding:26px max(18px,calc((100% - 900px)/2)) 22px}
h1{font-size:1.5rem;margin:0 0 5px}header p{margin:0;opacity:.9;font-size:.93rem}
main{max-width:900px;margin:18px auto;padding:0 14px 32px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.tab,button,select,input{font:inherit}.tab{padding:11px 6px;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink);font-weight:650}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 4px 15px #17365308}
.hidden{display:none!important}.muted{color:var(--muted);font-size:.9rem}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.btn{border:1px solid #cbd8e5;background:#fff;border-radius:11px;padding:11px 13px;color:var(--ink);cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.4}
select,input{padding:10px;border:1px solid #cbd8e5;border-radius:10px;background:white;min-width:0}
.progress{height:8px;background:#e7edf4;border-radius:10px;overflow:hidden;margin:10px 0 16px}.progress>span{display:block;background:#3288c1;height:100%;width:0}
.kicker{font-size:.84rem;color:var(--muted)}.prompt{font-size:1.15rem;line-height:1.75;font-weight:700;margin:12px 0 17px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{text-align:left;line-height:1.5;min-height:54px;white-space:normal}.answer.correct{background:#e8f6ef;border-color:#9bd4b6}.answer.wrong{background:#fff0ef;border-color:#e6aaa5}
.feedback{min-height:28px;margin:12px 0;font-weight:650}.flash{min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fafdff;border:1px solid var(--line);border-radius:14px;padding:22px;cursor:pointer}.flash strong{font-size:1.5rem;line-height:1.6}.flash p{line-height:1.8}.term-list{display:grid;gap:8px;margin-top:14px}.term-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.term-item strong{display:block;margin-bottom:5px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#f5f8fb;border-radius:12px;padding:12px}.stat b{font-size:1.35rem;display:block}.foot{margin:18px 2px;color:var(--muted);font-size:.8rem}
@media(max-width:540px){.tabs{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:1fr}.panel{padding:14px}.prompt{font-size:1.05rem}}
</style></head><body>
<header><h1>ネットワーク単語ラボ</h1><p>そふかつ単語PDFから作った、直前チェック用の学習サイト</p></header>
<main>
<div class="statgrid"><div class="stat"><span class="muted">収録用語</span><b id="total">33</b></div><div class="stat"><span class="muted">累計正解</span><b id="totalCorrect">0</b></div><div class="stat"><span class="muted">復習リスト</span><b id="missCount">0</b></div></div>
<nav class="tabs"><button class="tab active" data-tab="quiz">4択クイズ</button><button class="tab" data-tab="flash">単語カード</button><button class="tab" data-tab="review">間違い復習</button><button class="tab" data-tab="dictionary">用語一覧</button></nav>
<section id="quiz" class="panel">
<div class="row"><label class="muted" for="quizmode">出題方向</label><select id="quizmode"><option value="definition">説明 → 用語</option><option value="term">用語 → 説明</option></select><label class="muted" for="quizcount">問題数</label><select id="quizcount"><option>10</option><option>20</option><option>全て</option></select></div>
<div class="progress"><span id="qbar"></span></div><div class="kicker" id="qcount">準備中</div><div class="prompt" id="question">「スタート」を押してね。</div><div class="answers" id="answerlist"></div><div class="feedback" id="qfeedback" aria-live="polite"></div>
<div class="row"><button class="btn primary" id="start">スタート / やり直す</button><button class="btn" id="next" disabled>次の問題 →</button></div>
</section>
<section id="flash" class="panel hidden"><div class="kicker" id="fcount"></div><div class="progress"><span id="fbar"></span></div><div class="flash" id="flashcard" role="button" tabindex="0"><span class="muted" id="flabel">タップして意味を表示</span><strong id="fword"></strong><p id="fdef"></p></div><div class="row" style="margin-top:12px"><button class="btn" id="fprev">← 前</button><button class="btn primary" id="flip">答えを見る</button><button class="btn" id="fnext">次 →</button></div></section>
<section id="review" class="panel hidden"><h2 style="margin-top:0">間違えた単語の復習</h2><p class="muted">クイズで間違えた語を集めて、もう一度出題します。</p><p id="reviewempty">まだ間違いはありません。4択クイズに挑戦してみよう。</p><button class="btn primary" id="reviewstart">復習クイズを開始</button><div id="reviewitems" class="term-list"></div></section>
<section id="dictionary" class="panel hidden"><h2 style="margin-top:0">用語一覧</h2><input id="search" type="search" placeholder="用語や説明を検索…" style="width:100%"><div id="dict" class="term-list"></div></section>
<p class="foot">進捗・復習リストはこの端末のブラウザに保存されます。PDFの定義に沿って収録しています。別の端末とは自動同期されません。</p>
</main>
<script>
const TERMS=[["OSI参照モデル", "ネットワークで使用する機器やデータを送受信する手順などを七つの階層に定義したもの。"], ["ハブ", "LANケーブルの中継や分岐に用いられる集線装置。"], ["ルータ", "IPアドレスをもとにデータの行き先を認識して転送し、パケットの経路選択機能などを持つ装置。"], ["パケットフィルタリング", "ルータが持つ機能の一つで、パケットの通過可否を判断する機能。"], ["ゲートウェイ", "プロトコルが異なるネットワーク間で、プロトコルを変換してデータの送受信を可能にする装置。"], ["プロトコル", "コンピュータどうしがネットワークを通して通信を行うために決められた手順。通信規約ともいう。"], ["TCP/IP", "インターネットやイントラネットで標準的に使用され、異なるOSなどの環境間でも通信を可能にする通信規約。"], ["HTTP", "WebサーバとWebブラウザとの間で、HTML文書や関連画像などのデータを送受信する通信規約。"], ["FTP", "HTMLファイルをWebサーバへアップロードするときなど、ネットワークを介してファイルを転送する通信規約。"], ["POP", "メールサーバのメールボックスに保存されたメールを受信するために用いる通信規約。"], ["IMAP", "メールサーバ上で電子メールを管理する通信規約。"], ["SMTP", "電子メールをユーザのコンピュータからメールサーバへ送信するときや、メールサーバ間でメールを転送するときに用いる通信規約。"], ["DHCP", "ネットワークに接続する際に、IPアドレスなどを自動的に割り当てる通信規約。"], ["MACアドレス", "ルータなどのネットワーク機器に割り当てられているハードウェア固有の番号。"], ["IPアドレス", "TCP/IPを用いたネットワーク上で、コンピュータを識別するための番号。"], ["プライベートIPアドレス", "会社や家庭のLAN内部で機器を識別するために、ネットワークアドレス部とホストアドレス部で構成された番号。"], ["グローバルIPアドレス", "インターネットに接続されたコンピュータを識別するため、一意となるように割り当てられた番号。"], ["サブネットマスク", "IPアドレスから、特定のグループを示すネットワークアドレスを取り出すための値。"], ["ネットワークアドレス", "IPアドレスを構成する32ビットのうち、個々の組織が管理するネットワーク（サブネット）を識別する部分。"], ["ブロードキャストアドレス", "コンピュータネットワークに接続されているすべての機器にデータを送信する特別なアドレス。"], ["ホストアドレス", "同一のネットワークグループ内で接続された個々のコンピュータ機器を識別するためのアドレス。"], ["ポート番号", "TCP/IPネットワーク上で、IPアドレスに設けられている補助アドレスであり、アプリケーションを識別するための番号。"], ["NAT", "グローバルIPアドレスとプライベートIPアドレスを1対1で結びつけて相互に変換し、LAN内のコンピュータがインターネットを利用できるようにするアドレス変換技術。"], ["DMZ", "非武装地帯と呼ばれ、外部ネットワークと内部ネットワークから隔離された区域（セグメント）。"], ["DNS", "インターネット上で使用するドメイン名とIPアドレスを互いに変換するしくみ。"], ["VPN", "インターネット上に構築される仮想的な専用回線。"], ["通信速度（bps）", "ネットワーク上でデータを送受信するときに、1秒間に転送できるデータのビット数。"], ["転送時間", "データをインターネット上のサーバなどから送信・転送するときの所要時間。"], ["伝送効率", "データ通信において、実質的にデータを送ることができる回線の割合。"], ["シンクライアント", "クライアントには必要最小限の機能だけを持たせ、サーバでアプリケーションなどを管理するシステム構成。情報漏えい対策としても注目される。"], ["Cookie", "Webサイトの訪問日時や回数などの情報を、利用者のコンピュータに保存するしくみ。"], ["MIME", "各国の文字や画像、動画など、形式の異なるさまざまなデータを電子メールで扱うための規格。"], ["VoIP", "インターネットやイントラネットなどの情報通信ネットワークを使って、音声データを送受信する技術。"]];
const $=id=>document.getElementById(id);
let tab="quiz",deck=[...TERMS],qi=0,qscore=0,qactive=false,qanswered=false,qcorrectTotal=Number(localStorage.nlCorrect||0),misses=new Set(JSON.parse(localStorage.nlMisses||"[]")),flashIndex=0,flipped=false;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function save(){localStorage.nlCorrect=qcorrectTotal;localStorage.nlMisses=JSON.stringify([...misses]);$("totalCorrect").textContent=qcorrectTotal;$("missCount").textContent=misses.size;renderReview()}
function setTab(t){tab=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));["quiz","flash","review","dictionary"].forEach(id=>$(id).classList.toggle("hidden",id!==t));if(t==="dictionary")renderDict()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function startQuiz(items=TERMS){deck=shuffle(items);let n=$("quizcount").value;deck=n==="全て"?deck:deck.slice(0,Number(n));qi=0;qscore=0;qactive=true;renderQ()}
function renderQ(){if(!deck.length){$("question").textContent="復習対象がありません。";$("answerlist").innerHTML="";return}if(qi>=deck.length){$("qcount").textContent="完了";$("qbar").style.width="100%";$("question").textContent=`終了！ ${deck.length}問中 ${qscore}問正解`; $("answerlist").innerHTML="";$("qfeedback").textContent="復習リストで間違えた用語を確認しよう。";$("next").disabled=true;return}
qanswered=false;$("next").disabled=true;$("qfeedback").textContent="";$("qcount").textContent=`問題 ${qi+1} / ${deck.length}　・正解 ${qscore}`;$("qbar").style.width=(qi/deck.length*100)+"%";let item=deck[qi],rev=$("quizmode").value==="term";$("question").textContent=rev?item[0]:item[1];let opts=shuffle([item,...shuffle(TERMS.filter(x=>x[0]!==item[0])).slice(0,3)]);$("answerlist").innerHTML="";opts.forEach(o=>{let b=document.createElement("button");b.className="btn answer";b.textContent=rev?o[1]:o[0];b.onclick=()=>answer(b,o,item);$("answerlist").append(b)})}
function answer(btn,chosen,correct){if(qanswered)return;qanswered=true;let ok=chosen[0]===correct[0];if(ok){qscore++;qcorrectTotal++;btn.classList.add("correct");$("qfeedback").textContent="正解！";$("qfeedback").style.color="var(--green)"}else{misses.add(correct[0]);btn.classList.add("wrong");$("qfeedback").textContent="正解は「"+correct[0]+"」";$("qfeedback").style.color="var(--red)";[...$("answerlist").children].forEach(b=>{if(b.textContent===( $("quizmode").value==="term"?correct[1]:correct[0]))b.classList.add("correct")})}
[...$("answerlist").children].forEach(b=>b.disabled=true);$("next").disabled=false;$("qcount").textContent=`問題 ${qi+1} / ${deck.length}　・正解 ${qscore}`;save()}
$("start").onclick=()=>startQuiz();$("next").onclick=()=>{qi++;renderQ()};$("reviewstart").onclick=()=>{if(!misses.size){alert("復習リストは空だよ。まずクイズに挑戦！");return}setTab("quiz");startQuiz(TERMS.filter(x=>misses.has(x[0])))};
function showFlash(){let it=TERMS[flashIndex];flipped=false;$("fcount").textContent=`カード ${flashIndex+1} / ${TERMS.length}`;$("fbar").style.width=(flashIndex/TERMS.length*100)+"%";$("flabel").textContent="タップして意味を表示";$("fword").textContent=it[0];$("fdef").textContent=""}
function flip(){let it=TERMS[flashIndex];flipped=!flipped;$("flabel").textContent=flipped?"意味":"タップして意味を表示";$("fword").textContent=flipped?it[1]:it[0];$("fdef").textContent=flipped?it[0]:""}
$("flashcard").onclick=flip;$("flashcard").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};$("flip").onclick=flip;$("fprev").onclick=()=>{flashIndex=(flashIndex+TERMS.length-1)%TERMS.length;showFlash()};$("fnext").onclick=()=>{flashIndex=(flashIndex+1)%TERMS.length;showFlash()};
function renderReview(){$("reviewempty").classList.toggle("hidden",misses.size>0);$("reviewitems").innerHTML="";TERMS.filter(x=>misses.has(x[0])).forEach(x=>{let d=document.createElement("div");d.className="term-item";let s=document.createElement("strong");s.textContent=x[0];let p=document.createElement("span");p.textContent=x[1];d.append(s,p);$("reviewitems").append(d)})}
function renderDict(){let q=$("search").value.trim().toLowerCase();$("dict").innerHTML="";TERMS.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)).forEach(x=>{let d=document.createElement("div");d.className="term-item";let s=document.createElement("strong");s.textContent=x[0];let p=document.createElement("span");p.textContent=x[1];d.append(s,p);$("dict").append(d)})}
$("search").oninput=renderDict;showFlash();save();renderDict();renderQ();
</script></body></html>
